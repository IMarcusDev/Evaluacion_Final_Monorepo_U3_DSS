apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: mysql-pvc
    namespace: conjunta-desarrollo-seguro
spec:
    accessModes: ["ReadWriteOnce"]
    resources:
        requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: mysql
    namespace: conjunta-desarrollo-seguro
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels: { app: mysql }
    template:
        metadata:
            labels: { app: mysql }
        spec:
            automountServiceAccountToken: false
            containers:
                - name: mysql
                  image: mysql:8.0
                  ports:
                      - containerPort: 3306
                  env:
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom: { secretKeyRef: { name: inventrack-secrets, key: DB_PASSWORD } }
                      - name: MYSQL_DATABASE
                        valueFrom: { configMapKeyRef: { name: inventrack-config, key: DB_NAME } }
                  volumeMounts:
                      - name: mysql-storage
                        mountPath: /var/lib/mysql
                      - name: initdb
                        mountPath: /docker-entrypoint-initdb.d
                        readOnly: true
                  readinessProbe:
                      exec: { command: ["mysqladmin", "ping", "-h", "localhost"] }
                      initialDelaySeconds: 10
                      periodSeconds: 5
                  livenessProbe:
                      exec: { command: ["mysqladmin", "ping", "-h", "localhost"] }
                      initialDelaySeconds: 30
                      periodSeconds: 10
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { cpu: 500m, memory: 512Mi }
            volumes:
                - name: mysql-storage
                  persistentVolumeClaim: { claimName: mysql-pvc }
                - name: initdb
                  configMap: { name: mysql-initdb }
---
apiVersion: v1
kind: Service
metadata:
    name: mysql
    namespace: conjunta-desarrollo-seguro
spec:
    type: ClusterIP
    selector: { app: mysql }
    ports:
        - port: 3306
          targetPort: 3306
