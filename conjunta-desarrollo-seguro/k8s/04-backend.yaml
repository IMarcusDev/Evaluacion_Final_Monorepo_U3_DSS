apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: uploads-pvc
    namespace: conjunta-desarrollo-seguro
spec:
    accessModes: ["ReadWriteOnce"]
    resources:
        requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: conjunta-desarrollo-seguro
spec:
    replicas: 1
    selector:
        matchLabels: { app: backend }
    template:
        metadata:
            labels: { app: backend }
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                fsGroup: 1001
            initContainers:
                - name: wait-for-mysql
                  image: mysql:8.0
                  command:
                      - sh
                      - -c
                      - |
                          until mysqladmin ping -h mysql --silent; do
                            echo "esperando a mysql..."; sleep 2;
                          done
                  resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits: { cpu: 100m, memory: 128Mi }
            containers:
                - name: backend
                  image: inventrack-backend:1.0
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 4000
                  env:
                      - name: PORT
                        valueFrom: { configMapKeyRef: { name: inventrack-config, key: PORT } }
                      - name: DB_HOST
                        valueFrom: { configMapKeyRef: { name: inventrack-config, key: DB_HOST } }
                      - name: DB_USER
                        valueFrom: { configMapKeyRef: { name: inventrack-config, key: DB_USER } }
                      - name: DB_NAME
                        valueFrom: { configMapKeyRef: { name: inventrack-config, key: DB_NAME } }
                      - name: DB_PASSWORD
                        valueFrom: { secretKeyRef: { name: inventrack-secrets, key: DB_PASSWORD } }
                      - name: JWT_SECRET
                        valueFrom: { secretKeyRef: { name: inventrack-secrets, key: JWT_SECRET } }
                      - name: GROQ_API_KEY
                        valueFrom: { secretKeyRef: { name: inventrack-secrets, key: GROQ_API_KEY } }
                  volumeMounts:
                      - name: uploads
                        mountPath: /app/uploads
                  readinessProbe:
                      httpGet: { path: /api/health, port: 4000 }
                      initialDelaySeconds: 10
                      periodSeconds: 5
                  livenessProbe:
                      httpGet: { path: /api/health, port: 4000 }
                      initialDelaySeconds: 20
                      periodSeconds: 15
                  resources:
                      requests: { cpu: 100m, memory: 128Mi }
                      limits: { cpu: 500m, memory: 256Mi }
            volumes:
                - name: uploads
                  persistentVolumeClaim: { claimName: uploads-pvc }
---
apiVersion: v1
kind: Service
metadata:
    name: backend
    namespace: conjunta-desarrollo-seguro
spec:
    type: ClusterIP
    selector: { app: backend }
    ports:
        - port: 4000
          targetPort: 4000
